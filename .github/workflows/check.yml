name: Check
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build_mocklinux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build mocklinux
        working-directory: mocklinux
        run: make
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint with Clippy
        run: cargo clippy --all-features --all-targets

      - name: Check formatting
        run: cargo fmt --check

      - name: Build Debug
        run: cargo build

      - name: Run tests
        run: cargo test

      - name: Build Release
        run: cargo build --release
